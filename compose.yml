services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: always

    ports:
      - "9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

  portainer-agent:
    image: portainer/agent:lts
    container_name: portainer_agent
    restart: always

    ports:
      - "9001:9001"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

volumes:
  portainer-data:
